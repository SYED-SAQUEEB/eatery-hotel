<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
        height: 100%;
        margin: 0;
        font-family: 'Poppins', sans-serif;
      }
      
      .container {
        background-image: url('img/s10.jpg'); /* Your background image */
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .booking-form {
        background: rgba(255, 255, 255, 0.2); /* Transparent form */
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        width: 650px;
        backdrop-filter: blur(10px); /* For nice glassmorphism effect */
        animation: fadeIn 1s ease-in-out;
      }
      
      .booking-form h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #fff;
      }
      
      .booking-form input, .booking-form select, .booking-form button {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        font-size: 16px;
      }
      
      .booking-form input, .booking-form select {
        background: rgba(255, 255, 255, 0.7);
      }
      
      .booking-form button {
        background-color: #28a745;
        color: white;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .booking-form button:hover {
        background-color: #218838;
      }
      
      .payment-section {
        margin-top: 20px;
      }
      
      #responseMessage {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
        color: #fff;
        animation: fadeIn 1s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }



      .menu-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
        background: linear-gradient(90deg, #ff7f50, #1e90ff);
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        margin: 20px auto;
        width: 95%;
        animation: slideDown 1s ease-in-out;
      }
      @keyframes slideDown {
        from {
          transform: translateY(-100px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .menu-bar a {
        text-decoration: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        margin: 0 20px;
        transition: transform 0.3s, color 0.3s;
      }
      .menu-bar a:hover {
        transform: scale(1.1);
        color: #ffd700;
      }
      
  </style>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
      
        const bookingData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          checkin: document.getElementById('checkin').value,
          checkout: document.getElementById('checkout').value,
          guests: document.getElementById('guests').value,
          paymentMethod: document.getElementById('paymentMethod').value
        };
      
        try {
          // Dummy API Request (replace with your backend)
          await new Promise(resolve => setTimeout(resolve, 1000)); // Simulate server delay
      
          document.getElementById('responseMessage').innerText = "Thanks for booking! Enjoy our service. Have a good day!";
          document.getElementById('bookingForm').reset(); // Clear form after booking
      
        } catch (error) {
          document.getElementById('responseMessage').innerText = 'Booking failed!';
        }
      });
      
  </script>
</head>
<body>

  <nav class="menu-bar">
    <a href="index.html">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="Menu.html">Menu</a>
    <a href="index.html">Contact</a>
  </nav>

  <div class="container">
    <form id="bookingForm" class="booking-form">
      <h2>Book Your Stay</h2>

      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="text" id="phone" placeholder="Phone Number" required>
      <input type="date" id="checkin" required>
      <input type="date" id="checkout" required>
      <input type="number" id="guests" placeholder="Number of Guests" required>

      <div class="payment-section">
        <label>Payment Method:</label>
        <select id="paymentMethod" required>
          <option value="">Select Payment Method</option>
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
          <option value="Google Pay">Google Pay</option>
          <option value="Phone Pay">Phone Pay</option>
        </select>
      </div>

      <button type="submit">Confirm Booking</button>

      <div id="responseMessage"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
