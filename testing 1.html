<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Room Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url('img/s10.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .booking-form {
      width: 650px;
      margin: 50px auto;
      padding: 50px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    .booking-form h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .booking-form label {
      display: block;
      margin-bottom: 5px;
    }
    .booking-form input, .booking-form select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .booking-form button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .booking-form button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <form class="booking-form" id="bookingForm">
    <h2>Hotel Room Booking</h2>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>
    
    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin" required>
    
    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout" required>
    
    <label for="roomType">Room Type:</label>
    <select id="roomType" name="roomType">
      <option value="single">Single</option>
      <option value="double">Double</option>
      <option value="suite">Suite</option>
    </select>
    
    <label for="price">Price:</label>
    <input type="number" id="price" name="price" required>
    
    <label for="paymentMethod">Payment Method:</label>
    <select id="paymentMethod" name="paymentMethod">
      <option value="cash">Cash</option>
      <option value="card">Card</option>
      <option value="phonepay">Phone Pay</option>
      <option value="googlepay">Google Pay</option>
    </select>
    
    <button type="button" onclick="confirmBooking()">Confirm Booking</button>
  </form>
  <script>
    function confirmBooking() {
      alert('Thank you for Booking, Enjoy our Service. Have a nice day!');
    }
  </script>
</body>
</html>
